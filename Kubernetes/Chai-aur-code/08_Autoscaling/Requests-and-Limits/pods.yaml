apiVersion: v1
kind: Pod
metadata:
  name: stress-test
spec:
  containers:
  - name: stress-test-container
    image: polinux/stress
    command: ["stress","--vm", "1", "--vm-bytes", "150M", "--timeout", "60s"]
    resources:
      requests:
        memory: "50Mi"
      limits: 
        memory: "100Mi"
    
# Meaning:

# Scheduling phase
# Kubernetes ensures node has 50Mi free before scheduling the pod

# Runtime phase
# Container can grow up to 100Mi

# If it exceeds 100Mi
# Container is killed (OOMKilled)

# Since your stress command tries to allocate 150Mi, it will exceed the limit.